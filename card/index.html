<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <form>
        <table>
            <h2>Checkout</h2>
            <p>Complete Your purchase securely</p>
          <tr>
            <td>Contact Info</td>
          </tr>
          <tr>
            <td><input type="text" placeholder="Full Name" required /></td>
          </tr>
          <tr>
            <td><input type="email" placeholder="Email Address" required /></td>
          </tr>
          <tr>
            <td>Shipping Address</td>
          </tr>
          <tr>
            <td><textarea name="" id="" placeholder="Address"></textarea></td>
          </tr>
          <td><input type="text" placeholder="Address" required /></td>
          <td>
            <select id="city" name="city">
              <option value="">-- Select City --</option>
              <option value="lucknow">Lucknow</option>
              <option value="delhi">Delhi</option>
              <option value="mumbai">Mumbai</option>
              <option value="bangalore">Bangalore</option>
            </select>
          </td>
          <tr>
          </tr>
          <td><input type="number" placeholder="Zip Code"></td>
          <td><input type="number" placeholder="Phone Number"></td>
        </table>
      </form>
    </main>
  </body>
</html>
